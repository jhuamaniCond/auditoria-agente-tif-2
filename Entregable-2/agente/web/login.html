<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Agente de Evidencia</title>
  <link rel="stylesheet" href="{{ url_for('agente.static', filename='agente.css') }}">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 16px; }
    .caja-login { width: 100%; max-width: 380px; background: var(--superficie); border: 1px solid var(--borde);
      border-radius: 14px; box-shadow: var(--sombra); padding: 28px 26px; }
    .caja-login .cabeza { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .caja-login .sello { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 10px;
      background: var(--marca); color: #fff; flex: none; }
    .caja-login .cabeza small { display: block; }
    .caja-login label { display: block; font-weight: 600; font-size: .88rem; margin: 14px 0 6px; }
    .caja-login input { width: 100%; padding: 10px 12px; border: 1px solid var(--borde-fuerte); border-radius: 8px;
      background: var(--superficie-2); color: var(--texto); font: inherit; }
    .caja-login input:focus { outline: 2px solid var(--marca-2); outline-offset: 1px; border-color: transparent; }
    .caja-login button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 8px;
      background: var(--marca); color: #fff; font: 600 .95rem var(--fuente); cursor: pointer; }
    .caja-login button:hover { background: var(--marca-2); }
    .caja-login .error { margin-top: 14px; padding: 9px 12px; border-radius: 8px; background: var(--mal-fondo);
      color: var(--mal); font-size: .88rem; }
    .caja-login .pie { margin-top: 18px; text-align: center; }
  </style>
</head>
<body>
  <main class="caja-login">
    <div class="cabeza">
      <span class="sello" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z"/><path d="M8.5 12l2.5 2.5L15.5 10"/></svg>
      </span>
      <div><h1 style="font-size:1.1rem">Agente de Evidencia y Auditoría</h1><small>PIMS · ISO/IEC 27701:2025</small></div>
    </div>
    <form method="post" action="{{ url_for('autenticacion.login') }}" autocomplete="on">
      <input type="hidden" name="siguiente" value="{{ siguiente }}">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" autocomplete="username" required autofocus>
      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" autocomplete="current-password" required>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <button type="submit">Iniciar sesión</button>
    </form>
    <div class="pie"><small>Acceso restringido al equipo auditor</small></div>
  </main>
</body>
</html>
