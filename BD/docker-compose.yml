# PostgreSQL + pgAdmin para el Agente de Evidencia y Auditoria (Grupo 6).
#
#   docker compose up -d        (desde la carpeta BD/)
#
#   PostgreSQL  localhost:5432  base pims_auditoria, usuario agente / agente_local
#   pgAdmin     http://localhost:5050  (sin login; el servidor "PIMS G6" ya viene registrado)
#
# Al crear el volumen por primera vez PostgreSQL ejecuta schema.sql automaticamente.
# Credenciales solo para desarrollo local.
services:
  postgres:
    image: postgres:16.4
    container_name: pims_g6_postgres
    environment:
      POSTGRES_DB: pims_auditoria
      POSTGRES_USER: agente
      POSTGRES_PASSWORD: agente_local
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      - pims_g6_datos:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agente -d pims_auditoria"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9.19
    container_name: pims_g6_pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_local
      PGADMIN_CONFIG_SERVER_MODE: "False"                 # modo escritorio: sin pantalla de login
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    # libpq exige que pgpass tenga permisos 600: se copia dentro del contenedor antes de arrancar
    entrypoint: >
      /bin/sh -c "cp /pgadmin4/pgpass.origen /tmp/pgpass && chmod 600 /tmp/pgpass && exec /entrypoint.sh"
    ports:
      - "5050:80"
    volumes:
      - pims_g6_pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass.origen:ro

volumes:
  pims_g6_datos:
  pims_g6_pgadmin:
